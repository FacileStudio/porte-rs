[package]
name = "porte"
version = "0.8.0"
edition = "2024"
rust-version = "1.98"
description = "Registre sign-in, sessions, spaces and MCP auth for Facile Suite Rust apps, a port of Go porte"
repository = "https://github.com/FacileStudio/porte-rs"
license = "MIT"
publish = false

[features]
default = []
pg = ["dep:sqlx", "dep:aes-gcm", "dep:hkdf"]
net = ["dep:reqwest", "dep:rsa", "dep:tokio"]
oidc = ["net"]
spaces = []
mcp = ["oidc", "tronc/mcp"]
directory = ["net", "dep:tokio-util"]
exchange = ["net", "tokio/rt", "tronc/bulle"]
forfait = ["directory"]

[dependencies]
async-trait = "0.1.92"
axum = { version = "0.8.9", default-features = false, features = ["tokio"] }
base64 = "0.23.1"
getrandom = "0.4.3"
http = "1.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = { version = "0.11.1", features = ["oid"] }
subtle = "2.6.1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1.54.1", optional = true, features = ["sync", "time", "macros"] }
tokio-util = { version = "0.7.20", optional = true }
tower = "0.5.3"
tracing = "0.1.44"
tronc = { git = "https://github.com/FacileStudio/tronc-rs", tag = "v0.5.0", features = ["http"] }
aes-gcm = { version = "0.11.1", optional = true }
hkdf = { version = "0.13.0", optional = true }
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", optional = true, default-features = false, features = ["rustls"] }
rsa = { version = "0.10.0", optional = true, default-features = false, features = ["std", "pkcs1v15"] }
sqlx = { version = "0.9.0", optional = true, default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "time", "json"] }
url = "2.5.8"

[dev-dependencies]
http-body-util = "0.1.5"
sha2 = "0.11.1"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "test-util"] }
tower = { version = "0.5.3", features = ["util"] }
tronc = { git = "https://github.com/FacileStudio/tronc-rs", tag = "v0.5.0", features = ["http", "testdb"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "migrate"] }
async-trait = "0.1.92"
serde_json = "1.0.154"
url = "2.5.8"
rsa = { version = "0.10.0", default-features = false, features = ["std", "pkcs1v15", "encoding"] }
base64 = "0.23.1"
tokio-util = "0.7.20"

[[example]]
name = "signin"
required-features = ["pg", "oidc"]
