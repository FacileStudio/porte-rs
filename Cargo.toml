[package]
name = "porte"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Registre sign-in, sessions, spaces and MCP auth for Facile Suite Rust apps, a port of Go porte"
repository = "https://github.com/FacileStudio/porte-rs"
publish = false

[features]
default = []
pg = ["dep:sqlx", "dep:aes-gcm", "dep:hkdf"]

[dependencies]
async-trait = "0.1.92"
axum = { version = "0.8.9", default-features = false, features = ["tokio"] }
base64 = "0.23.1"
getrandom = "0.4.3"
http = "1.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
time = "0.3.55"
tower = "0.5.3"
tracing = "0.1.44"
tronc = { git = "file:///home/yann/Code/Facile/tronc-rs", tag = "v0.2.0", features = ["http"] }
aes-gcm = { version = "0.11.1", optional = true }
hkdf = { version = "0.13.0", optional = true }
percent-encoding = "2.3.2"
sqlx = { version = "0.9.0", optional = true, default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "time", "json"] }
url = "2.5.8"

[dev-dependencies]
http-body-util = "0.1.5"
sha2 = "0.11.1"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tower = { version = "0.5.3", features = ["util"] }
tronc = { git = "file:///home/yann/Code/Facile/tronc-rs", tag = "v0.2.0", features = ["http", "testdb"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "migrate"] }
async-trait = "0.1.92"
serde_json = "1.0.154"
